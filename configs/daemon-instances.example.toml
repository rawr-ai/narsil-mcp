version = 1

# One permanent file describes all desired daemons (instances) and their indexed roots.
# Keys (neural API access) are NOT stored here. Use: ~/.config/narsil-mcp/daemon.env
#
# Apply with:
#   ./scripts/apply-instances.py --config ./configs/daemon-instances.example.toml --dry-run
#
# Recommended pattern:
# - Put your real config in: ~/.config/narsil-mcp/instances.toml
# - Keep this file as a schema-ish example (safe to commit/share)

[[instances]]
label = "com.rawr.narsil-mcp-domain-a"
host = "127.0.0.1"
port = 12006
path = "/mcp"
index_path = "~/.cache/narsil-mcp-domain-a"

# Required repo roots (must exist on disk)
repos = ["/absolute/path/to/repo-a"]

# Optional roots (can be missing; used for generated outputs that appear later)
optional_repos = ["/absolute/path/to/repo-a/.generated"]

# Optional overrides
# wrapper_path = "~/.cache/narsil-mcp-domain-a/launchd-wrapper.sh"
# plist_path = "~/Library/LaunchAgents/com.rawr.narsil-mcp-domain-a.plist"
# env_file = "~/.config/narsil-mcp/daemon.env"
# bin = "/absolute/path/to/narsil-mcp"
# extra_args = ["--some-flag"]

[[instances]]
label = "com.rawr.narsil-mcp-domain-b"
port = 12007
index_path = "~/.cache/narsil-mcp-domain-b"
repos = ["/absolute/path/to/repo-b"]
optional_repos = []

