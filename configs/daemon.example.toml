# Single-instance daemon config (example)
#
# Copy this file to:
#   ~/.config/narsil-mcp/daemon.toml
#
# Then apply it with:
#   ./scripts/apply-daemon-config.py
#
# Notes:
# - Secrets do NOT go here. Put neural credentials in ~/.config/narsil-mcp/daemon.env
# - `required_repos` must exist. `optional_repos` are included only if present.

label = "com.rawr.narsil-mcp-heavy"

# MCP-over-HTTP endpoint the daemon serves.
host = "127.0.0.1"
port = 12006
path = "/mcp"

# Where narsil stores its persistent index and daemon logs.
index_path = "~/.cache/narsil-mcp"

# Optional overrides. These defaults are derived from `label` + `index_path`.
# plist_path = "~/Library/LaunchAgents/com.rawr.narsil-mcp-heavy.plist"
# wrapper_path = "~/.cache/narsil-mcp/launchd-wrapper.sh"
# env_file = "~/.config/narsil-mcp/daemon.env"
# bin = "/absolute/path/to/narsil-mcp"

# Repo roots to index (one daemon; many roots).
required_repos = [
  "/absolute/path/to/repo-a",
]

# Useful for generated outputs that may not exist initially.
optional_repos = [
  "/absolute/path/to/repo-a/.wundergraph/generated",
]

# Extra arguments passed to `narsil-mcp` after the default daemon flags.
# extra_args = [
#   "--persist-readonly",
# ]

